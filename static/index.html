<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='mvp.css'>
</head>
<body>
    <h1>Express practices</h1>
    <form action="/greet" method="get">
        <H2>GET REQUEST</H2>
        <label for="fname1">First name:</label>
        <input type="text" id="fname1" name="fname">
        <label for="lname1">Last name:</label>
        <input type="text" id="lname1" name="lname">
        <input type="submit" value="Say Hi with GET">
    </form>
    <form action="/math" method="post">
        <H2>POST REQUEST</H2>
        <label for="op1">Value 1:</label>
        <input type="number" id="op1" name="op1">
        <label for="op2">Value 2:</label>
        <input type="number" id="op2" name="op2">
        <lable for="operator">Operator</lable>
        <select id="operator" name="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input type="submit" value="Do Math with POST">
    </form>
    <form action="/magicball" method="post">
        <H2>Ask the magic 8-ball</H2>
        <input type="submit" value="What do you say?">
    </form>
    <form action="/getpicture" method="get">
        <h2>Select a category and size</h2>
        <label for="category">Categories</label>
        <select name="category" id="category">
            <option value="cat">Cats</option>
            <option value="dog">Dogs</option>
            <option value="bunny">Bunnies</option>
        </select>
        <label for="pwidth">Width:</label>
        <input type="number" name="pwidth" id="pwidth">
        <label for="pheight">Width:</label>
        <input type="number" name="pheight" id="pheight">
        <input type="submit" value="Get an image!">
    </form>
    
</body>
</html>
